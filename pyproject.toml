[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "claude-code-guardrails"
dynamic = ["version"]
description = "Config-driven safety hooks for Claude Code: protect secrets, gate live tools, keep PII out of logs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Gabe" }]
keywords = ["claude", "claude-code", "ai-agents", "guardrails", "llm-security", "hooks", "ai-safety"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/TGabeCar/claude-code-guardrails"
Issues = "https://github.com/TGabeCar/claude-code-guardrails/issues"
Changelog = "https://github.com/TGabeCar/claude-code-guardrails/blob/main/CHANGELOG.md"

[project.scripts]
claude-guardrails = "guardrails.cli:main"

[tool.hatch.version]
path = "guardrails/guard.py"

[tool.hatch.build.targets.wheel]
packages = ["guardrails"]

[tool.hatch.build.targets.sdist]
include = ["guardrails", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md"]
