name: Publish to PyPI

# Run manually (Actions tab > Publish to PyPI > Run workflow). Uses PyPI trusted publishing (no API token stored):
# on pypi.org, add a "pending publisher" for project claude-code-guardrails,
# owner TGabeCar, repo claude-code-guardrails, workflow publish.yml, environment pypi.

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
